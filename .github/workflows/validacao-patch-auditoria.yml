name: Validacao isolada do patch de auditoria
on:
  push:
    branches: [validacao-patch-auditoria]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Conferir e aplicar patch
        run: |
          cat proposta-auditoria/correcao.patch.part{01,02,03,04,05,06} > /tmp/auditoria.patch
          git apply --check /tmp/auditoria.patch
          git apply /tmp/auditoria.patch
          git diff --stat
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm test
      - run: npm run build
