name: Validacao isolada do patch de auditoria
on:
  push:
    branches: [validacao-patch-auditoria]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Conferir e aplicar patch
        run: |
          cat proposta-auditoria/correcao.patch.part{01,02,03,04,05,06} > /tmp/auditoria.patch
          git apply --check /tmp/auditoria.patch
          git apply /tmp/auditoria.patch
          git diff --stat
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm test
      - run: npm run build
  publicar-na-branch:
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e551ae75ee850a36463dd8e4c68fb7039d255eb8
          fetch-depth: 1
      - name: Aplicar exatamente a proposta testada
        run: |
          set -eu
          expected=e551ae75ee850a36463dd8e4c68fb7039d255eb8
          actual=$(git ls-remote origin refs/heads/correcao-auditoria-servidor | cut -f1)
          test "$actual" = "$expected"
          cat proposta-auditoria/correcao.patch.part{01,02,03,04,05,06} > /tmp/auditoria.patch
          git apply --check /tmp/auditoria.patch
          git apply /tmp/auditoria.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md server/server.js server/audit.js src/App.jsx test.js
          git commit -m 'Aplica correção de auditoria no servidor'
          git push origin HEAD:refs/heads/correcao-auditoria-servidor
